# SQL eval cases. `route` is the expected outcome: stats | podcasts | out_of_scope | ambiguous
# (ambiguous also covers a player name the resolver can't pin down).
# `reference_sql` is graded by execution match (evals/grading.py); null = route-only case.
# Data snapshot these were written against: as of Week 10, 2026.

- id: puka_targets_last3
  question: How many targets did Puka Nacua have over the last 3 weeks?
  route: stats
  reference_sql: |
    SELECT sum(targets) AS targets FROM weekly_stats
    WHERE player_id = (SELECT player_id FROM players WHERE name = 'Puka Nacua')
      AND season = 2026 AND season_type = 'REG' AND week BETWEEN 8 AND 10

- id: target_leaders_last3
  question: Who were the top 5 players in targets over the last 3 weeks?
  route: stats
  reference_sql: |
    SELECT player_name, sum(targets) AS targets FROM weekly_stats
    WHERE season = 2026 AND season_type = 'REG' AND week BETWEEN 8 AND 10
    GROUP BY player_id, player_name ORDER BY targets DESC LIMIT 5

