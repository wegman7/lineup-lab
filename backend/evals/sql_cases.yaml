- id: bijan_ppr_per_game_2026
  question: What's Bijan Robinson averaging in PPR points per game this season?
  route: stats
  reference_sql: |
    SELECT round(avg(fantasy_points_ppr), 1) FROM weekly_stats
    WHERE player_id = (SELECT player_id FROM players WHERE name = 'Bijan Robinson')
      AND season = 2026 AND season_type = 'REG'

- id: nacua_snaps_week9
  question: How many offensive snaps did Puka Nacua play in Week 9 this season?
  route: stats
  reference_sql: |
    SELECT offense_snaps FROM snap_counts
    WHERE player_id = (SELECT player_id FROM players WHERE name = 'Puka Nacua')
      AND season = 2026 AND week = 9

- id: rb_ppr_leaders_2026
  question: Who are the top 5 running backs in PPR points this season?
  route: stats
  reference_sql: |
    SELECT player_name, round(sum(fantasy_points_ppr), 1) AS pts FROM weekly_stats
    WHERE season = 2026 AND season_type = 'REG' AND position = 'RB'
    GROUP BY player_id, player_name ORDER BY pts DESC LIMIT 5

- id: qb_pass_yards_last_week
  question: Which quarterback threw for the most yards last week?
  route: stats
  reference_sql: |
    SELECT player_name, passing_yards FROM weekly_stats
    WHERE season = 2026 AND week = 10 AND season_type = 'REG' AND position = 'QB'
    ORDER BY passing_yards DESC LIMIT 1

