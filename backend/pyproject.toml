[project]
name = "lineup-lab"
version = "0.1.0"
description = "Fantasy football answers backed by the numbers and what analysts said."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10",
    "duckdb>=2.0",
    "fastapi>=0.165",
    "httpx>=0.28",
    "langgraph>=1.2",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
ingest = ["nflreadpy>=0.1.5", "polars>=2.1", "pyarrow>=18"]
dev = ["httpx>=0.28", "pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineup_lab"]

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
